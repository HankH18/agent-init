name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Use info severity so we surface portability hints but only fail on errors.
          # Some intentional patterns (eval in config loader, dynamic var assignments
          # in --configure) emit SC2086/SC2155/SC2034/SC2016 warnings — suppress those.
          shellcheck \
            --severity=warning \
            --exclude=SC2086,SC2155,SC2034,SC2016,SC2046,SC1090,SC1091 \
            bin/agent-init install.sh setup-fork.sh

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n on all scripts
        run: |
          bash -n bin/agent-init
          bash -n install.sh
          bash -n setup-fork.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: --show-config defaults
        run: bash bin/agent-init --show-config

      - name: --help
        run: bash bin/agent-init --help

      - name: Init a fake project (--agent=both)
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke
          git init -q
          echo '{"name":"smoke","scripts":{"test":"echo ok"}}' > package.json
          bash $GITHUB_WORKSPACE/bin/agent-init --agent=both --quiet
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f .agents/specialists/planner.yaml
          test -f .claude/agents/planner.md
          test -f .codex/agents/planner.toml
          test -L .codex/skills/plan

      - name: Doctor passes on freshly-initialized project
        run: |
          cd /tmp/smoke
          bash $GITHUB_WORKSPACE/bin/agent-init doctor --agent=both

      - name: Sync is idempotent
        run: |
          cd /tmp/smoke
          bash $GITHUB_WORKSPACE/bin/agent-init sync --agent=both
          bash $GITHUB_WORKSPACE/bin/agent-init doctor --agent=both
